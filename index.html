<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macros</title>
<meta name="description" content="Recompte de kcal, macros i aigua">
<meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Macros">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top" id="top"></header>
<main id="view"></main>

<nav class="tabbar" id="tabbar">
  <button data-tab="today" class="active" aria-label="Avui">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"/></svg><span>Avui</span>
  </button>
  <button data-tab="meal" aria-label="Menjar">
    <svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 21V3c-2 1.5-3 4-3 7v3h3"/></svg><span>Menjar</span>
  </button>
  <button data-tab="foods" aria-label="Aliments">
    <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Aliments</span>
  </button>
  <button data-tab="stats" aria-label="Estadístiques">
    <svg viewBox="0 0 24 24"><path d="M5 20V12M10 20V5M15 20v-9M20 20V8"/></svg><span>Estadístiques</span>
  </button>
  <button data-tab="profile" aria-label="Perfil">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg><span>Perfil</span>
  </button>
</nav>

<div class="sheet-wrap" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="foods.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
